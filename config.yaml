# Tack configuration
# project: URL of your GitHub Project (org or user)
project: "https://github.com/orgs/your-org/projects/1"

focus:
  - 100
  - 200

# team: GitHub usernames with optional display names
team:
  - login: alice
    name: Alice
  - login: bob
    name: Bob
  - login: charlie
    name: Charlie

# status_field: name of the Status field in your GitHub Project
status_field: "Status"

# me: your GitHub login. Required for :ship — graduating a hibana note
# to the board needs to know whose person bucket the new (upstash-backed)
# row lives under.
# me: alice

# planning: personal planning data directory
# Can point to an Obsidian vault or any local/synced folder
planning:
  dir: "~/.tack"
  max_week_focus: 3
  # obsidian: required. Sealed monthly reflections (via :reflect) land in
  # <vault>/<monthly_subdir>/<YYYY-MM>.md. monthly_subdir defaults to "monthly".
  obsidian:
    vault: "~/Documents/obsidian-vault"
    monthly_subdir: "monthly"

# repos: where each repo is checked out on this host. :ship uses these
# to set the working tree of the new tmux session. Missing entries fall
# back to ~/work/<basename of repo>.
# repos:
#   kumo-ai/kumo: ~/work/kumo

# workspace_dir: root for per-ticket scratch folders. :start creates
# <workspace_dir>/<session-name>/ (GH row → <num>-<slug>, upstash row →
# <slug>) and seeds PLAN.md + PROGRESS.md. Defaults to ~/.tack/workspace.
# workspace_dir: "~/.tack/workspace"

# ship_host: tmux host used by :start and :ship. Set to an ssh alias
# ("aws") when running tack on a local laptop, or "local" when tack
# itself runs on the remote box. Defaults to "aws".
# ship_host: "aws"
